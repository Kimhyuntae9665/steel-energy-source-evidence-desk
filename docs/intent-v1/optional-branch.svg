<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660"><title>Optional stored intent review branch</title><desc>Stored raw typed intent goes to human semantic review. Review can populate the visible query builder. It does not execute a query; a separate source-label confirmation is required. Generic glyphs, no technology logos or live inference claim.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#374354"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a7b5c7"/></marker></defs><rect width="360" height="660" fill="#171e2a"/><rect width="360" height="660" fill="url(#dots)"/><path d="M180 190C215 210 215 235 180 255" stroke="#a7b5c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M180 405C215 425 215 450 180 470" stroke="#a7b5c7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="115" y="40" width="130" height="110" rx="20" fill="white" stroke="#b8c6da" stroke-width="2"/><svg x="144" y="59" width="72" height="72" viewBox="0 0 48 48"><g fill="none" stroke="#245b7c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h32v27H24l-10 8v-8H8zM15 15h18M15 23h12"/></g></svg><text x="180" y="185" fill="#dbe5f2" font-family="sans-serif" font-size="32" text-anchor="middle">Intent</text><rect x="115" y="255" width="130" height="110" rx="20" fill="white" stroke="#b8c6da" stroke-width="2"/><svg x="144" y="274" width="72" height="72" viewBox="0 0 48 48"><g fill="none" stroke="#245b7c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="13" r="7"/><path d="M9 40v-7c0-10 28-10 28 0v7M29 28l5 5 9-9"/></g></svg><text x="180" y="400" fill="#dbe5f2" font-family="sans-serif" font-size="32" text-anchor="middle">Review</text><rect x="115" y="470" width="130" height="110" rx="20" fill="white" stroke="#b8c6da" stroke-width="2"/><svg x="144" y="489" width="72" height="72" viewBox="0 0 48 48"><g fill="none" stroke="#245b7c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h36L28 26v15l-8-4V26z"/></g></svg><text x="180" y="615" fill="#dbe5f2" font-family="sans-serif" font-size="32" text-anchor="middle">Query</text></svg>
